plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable

# Several methods are structured to be identical cross-language. So there is no point flagging them constantly
Metrics:
  Enabled: false

# This file includes several types of expression all with a single public API `#evaluate` - Which sometimes will return
# an evaluation and sometimes a boolean. So we don't want to flag the method name as a predicate method, because strictly
# speaking, it isn't always a predicate method. It is a method that evaluates an expression and returns the result of that evaluation.
Naming/PredicateMethod:
  Exclude:
    - 'lib/cucumber/tag_expressions/expressions.rb'

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Layout/LineLength:
  Max: 200

Style/Documentation:
  Enabled: false

Style/RegexpLiteral:
  EnforcedStyle: slashes
  AllowInnerSlashes: true

RSpec/MessageSpies:
  EnforcedStyle: receive
